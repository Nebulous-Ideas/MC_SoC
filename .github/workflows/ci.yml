name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I -m unittest discover -s tests
      - run: python3 -I verify.py --all
      - run: python3 -I exchange.py check
